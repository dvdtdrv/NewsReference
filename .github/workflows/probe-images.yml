# One-off photo tests, started by hand (probe_images.py: feed vs page photos;
# probe_photo_urls.py: do photo addresses load on our site). Runs on David's PC, which can reach all outlets.
# The result stays on the PC: C:\Users\<you>\actions-runner\probe_images.json

name: Test article photos (on David's PC)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 25
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Compare feed photos with page photos
        shell: powershell
        run: |
          $py = "$env:USERPROFILE\anaconda3\python.exe"
          if (-not (Test-Path $py)) { $py = "python" }
          $env:PYTHONIOENCODING = "utf-8"
          & $py -m pip install -q -r requirements.txt
          & $py probe_docs.py "$env:USERPROFILE\actions-runner\docs"
