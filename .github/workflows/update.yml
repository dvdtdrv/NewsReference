# Runs the whole pipeline on GitHub every 30 minutes and publishes the website.
#
#   1. gets the saved data (all articles and stories so far) from the "data" branch
#   2. collect.py -> group_stories.py -> build_site.py   (the same as run_all.bat)
#      then build_search.mjs makes the search index for the search page
#   3. saves the updated data back to the "data" branch
#   4. publishes the site/ folder with GitHub Pages
#
# The "data" branch always holds just ONE snapshot (it's replaced every run), so the
# project doesn't grow by a new copy of the archive every 30 minutes.
# You can also start a run by hand: Actions tab -> "Update News Reference" -> Run workflow.

name: Update News Reference

on:
  schedule:
    - cron: "7,37 * * * *"     # at :07 and :37 past every hour (UTC); exact start can be a few minutes late
  workflow_dispatch:

permissions:
  actions: read      # to pick up the articles David's PC read (local-fetch.yml)
  contents: write    # to save the data branch
  pages: write       # to publish the website
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false   # never let two runs overwrite each other's data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the saved data
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C data
            echo "Loaded saved data from the data branch."
          elif [ -d seed ]; then
            cp -r seed/. data/
            echo "First run: starting from the seed folder."
          else
            echo "First run: starting with an empty archive."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Get the articles David's PC read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow local-fetch.yml --status success \
               --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$id" ]; then
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -n local-articles -D local_in || true
          fi
          if [ -f local_in/local_articles.json ]; then echo "Got the PC's articles (run $id)."; else echo "No articles from the PC."; fi

      - name: Collect, group, build
        run: |
          python collect.py
          python group_stories.py
          python build_site.py

      - name: Set up Node.js (for the search index)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build the search index
        run: |
          npm ci --no-audit --no-fund
          node build_search.mjs

      - name: Save the data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd data
          git init -q -b data
          git config user.name "news-reference-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Data as of $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish the website
        id: deploy
        uses: actions/deploy-pages@v4
