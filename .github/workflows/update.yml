# Runs the whole pipeline on GitHub every 30 minutes and publishes the website.
# Started by David's PC after it reads its outlets (see local-fetch.yml), or by the timer as a backup.
#
#   1. gets the saved data (all articles and stories so far) from the "data" branch
#   2. collect.py -> group_stories.py -> build_site.py   (the same as run_all.bat)
#      then build_search.mjs makes the search index for the search page
#   3. saves the updated data back to the "data" branch
#   4. publishes the site/ folder with GitHub Pages
#
# The "data" branch always holds just ONE snapshot (it's replaced every run), so the
# project doesn't grow by a new copy of the archive every 30 minutes.
# You can also start a run by hand: Actions tab -> "Update News Reference" -> Run workflow.

name: Update News Reference

on:
  schedule:
    - cron: "37 * * * *"       # backup, once an hour; normally David's PC starts this every ~30 minutes
  workflow_dispatch:

permissions:
  actions: write     # to pick up the articles David's PC read, and to ask it for the next round
  contents: write    # to save the data branch
  pages: write       # to publish the website
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false   # never let two runs overwrite each other's data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30         # normal runs take 6-9 minutes; 30 leaves room after a long pause
    # no "environment" here: the Pages publishing slot is only taken by the short "publish" job below,
    # so a quick outlet-info rebuild (rebuild.yml) never has to wait for this long job (9 Nov 2026)
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Note the start time
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Get the saved data
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C data
            echo "Loaded saved data from the data branch."
          elif [ -d seed ]; then
            cp -r seed/. data/
            echo "First run: starting from the seed folder."
          else
            echo "First run: starting with an empty archive."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Get the articles David's PC read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow local-fetch.yml --status success \
               --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$id" ]; then
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -n local-articles -D local_in || true
          fi
          if [ -f local_in/local_articles.json ]; then echo "Got the PC's articles (run $id)."; else echo "No articles from the PC."; fi

      - name: Collect and group
        env:
          PYTHONUNBUFFERED: "1"     # show each outlet's line as it happens (so a stuck step shows where)
        run: |
          python collect.py
          python group_stories.py

      - name: Use the newest design
        # Collecting takes 6-15 minutes; a design change may have been published meanwhile. Take the latest
        # pages/texts right before building, so this run never publishes an older look over a newer quick
        # rebuild (9 Nov 2026: it did, because this step ran before collecting).
        run: |
          git fetch -q --depth 1 origin main
          git checkout FETCH_HEAD -- site_template.html build_site.py versions.py build_search.mjs outlets_info.json web

      - name: Build the pages
        run: python build_site.py

      - name: Set up Node.js (for the search index)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build the search index
        run: |
          npm ci --no-audit --no-fund
          node build_search.mjs

      - name: Save the data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd data
          git init -q -b data
          git config user.name "news-reference-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Data as of $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Package the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Ask David's PC for the next round
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the next update should start about 30 minutes after this one started;
          # the PC needs ~3 minutes to read its outlets, so it waits for the rest
          spent=$(( ($(date +%s) - STARTED) / 60 ))
          wait=$(( 27 - spent )); [ $wait -lt 0 ] && wait=0
          gh workflow run local-fetch.yml --repo "$GITHUB_REPOSITORY" -f wait=$wait || \
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/local-fetch.yml/dispatches" -f ref=main -f "inputs[wait]=$wait"
          echo "Asked the PC to read again in $wait minutes."

  publish:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deploy
        uses: actions/deploy-pages@v4
